# Every push gets checked. Leapfrog L2, 2026-08-09.
#
# NO SECRETS IN THIS FILE, AND NONE MAY BE ADDED TO IT. A gate that needs a live key belongs in a
# separate workflow, and must print a SKIP line and exit 0 when the key is absent — never a red run
# for a decision only the repo owner can make.
#
# WHY THIS ONE IS NOT THE NODE TEMPLATE. hoplight-ai/repo-template ships a build-only `npm ci &&
# npm run build` job, which assumes a compiled output this repo does not produce. Corrected
# 2026-09-17 (RUMITIDY1): this repo DOES have a package.json with real scripts (rumi:11:packs,
# rumi:voices, etc.) and a real generator pipeline under scripts/ — the false claim that neither
# existed dated back to before that pipeline landed and was never fixed. What is still true, and
# is the actual reason this workflow is not the node template, is that there is nothing here to
# `npm ci` or `npm run build`: rumi-espanol-app.html is a static, hand-shipped file (one voice's
# audio embedded inline, the other four in `voices/`) with no compiled output, so a build-only
# job would be red on every push forever, which is worse than no workflow, because a check
# nobody can make green stops being read within a week.
#
# What `scripts/ci-check.mjs` gates instead is the failure a static, hand-edited HTML file actually
# has: a hand-edit that breaks an inline <script>, or an audio bank that lost or truncated clips.
# The second one is the reason this file exists — a cut clip renders a perfect page and plays
# silence, the user is five years old, and nothing else in the world will report it.
#
# Observed green (17 assertions) and observed red three separate ways — a clip truncated mid-file,
# a syntax error in the app block, and an index.html appearing — locally on 2026-08-21 before this
# file was committed. A gate nobody has seen fail is a gate nobody knows is connected.

name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    # This name string is what a required status check would match on. Renaming the job silently
    # stops it being recognized as that check. Do not rename it.
    name: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        id: setup
        with:
          # Match this to the Vercel project's own nodeVersion so CI runs on what production runs
          # on. Every project in this org is on 24.x as of 2026-08-09 — confirm via the Vercel
          # dashboard/API rather than assuming it stays that way.
          node-version: '24'

      # No install step: this repo has no dependencies. Both checks use only the node standard
      # library, deliberately, so there is nothing here that can rot or need a lockfile. Each step
      # carries its own `if`, so one red gate does not hide the other — a local `&&` chain would
      # report exactly one failure however many there are.

      - name: static checks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci-check.mjs

      # The app's own behavioural suite, moved here from quick-tools with the app on 2026-08-21.
      # 72 assertions over the real shipped corpus, no network. The one that earns it runs the
      # page's own buildOptions() and requires that no two answer options ever share an emoji:
      # once the options became pictures, a repeated glyph stopped being "hard" and became
      # unanswerable, and the real data does contain repeats across modules.
      - name: 'test: rumi behaviour'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/rumi-unit-test.mjs

      # The lock on the voice comparison page (middleware.js, 2026-11-08): no pair is 401, the right
      # pair passes, twenty wrong pairs from one address then 429, the app and its voices stay open.
      # No secrets: it sets a test pair of its own. Seen red with the gate set aside before commit.
      - name: 'test: voice page lock'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node --test scripts/rumi-gate-test.mjs

      # The gate that actually listens. Added 2026-08-30, after three separate bugs each made
      # the app COMPLETELY SILENT while both checks above stayed green. They had to: they read
      # the file, and every clip in the file was perfect. "Does a buffer reach the speakers" is
      # a property of a running browser, and nothing here was looking at one.
      #
      # This is the only step in this workflow that installs anything, and it is a deliberate
      # exception to the no-dependencies note at the top rather than a drift away from it. The
      # stated reason this workflow exists is that a silent app "renders a perfect page and
      # plays silence, the user is five years old, and nothing else in the world will report
      # it". That is precisely the failure this step catches and the other two cannot.
      #
      # --no-save keeps package.json dependency-free, so a fresh clone still runs the first two
      # gates with no install at all, and scripts/rumi-audio-smoke.mjs prints SKIP and exits 0
      # when playwright is absent. Observed red against the 2026-08-29 build on three separate
      # assertions, and green on this one, before this step was committed.
      - name: 'test: rumi audio (browser)'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/rumi-audio-smoke.mjs
